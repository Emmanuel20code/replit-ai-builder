openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: builder
    description: AI builder operations
  - name: github
    description: GitHub publishing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /builder/generate:
    post:
      operationId: generateProject
      tags: [builder]
      summary: Generate or refine a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateProjectInput"
      responses:
        "200":
          description: Generated project response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGeneration"
        "400":
          description: Invalid request
        "500":
          description: Generation failed
  /github/status:
    get:
      operationId: getGithubStatus
      tags: [github]
      summary: Check GitHub connection
      responses:
        "200":
          description: GitHub connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubConnection"
  /github/push:
    post:
      operationId: pushProjectToGithub
      tags: [github]
      summary: Create or update a GitHub repository with project files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubPushInput"
      responses:
        "200":
          description: Push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResult"
        "400":
          description: Invalid request
        "401":
          description: GitHub is not connected
        "500":
          description: Push failed
  /github/push-app:
    post:
      operationId: pushAppToGithub
      tags: [github]
      summary: Push the JEVISH AI Builder application source to GitHub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppPushInput"
      responses:
        "200":
          description: Application push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPushResult"
        "400":
          description: Invalid request
        "401":
          description: GitHub is not connected
        "500":
          description: Push failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProjectFile:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
      required: [path, content]
    GenerateProjectInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
        currentFiles:
          type: array
          items:
            $ref: "#/components/schemas/ProjectFile"
      required: [prompt]
    ProjectGeneration:
      type: object
      properties:
        summary:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/ProjectFile"
      required: [summary, files]
    GithubConnection:
      type: object
      properties:
        connected:
          type: boolean
        login:
          type: ["string", "null"]
        message:
          type: string
      required: [connected, login, message]
    GithubPushInput:
      type: object
      properties:
        repository:
          type: string
          minLength: 1
        description:
          type: string
        private:
          type: boolean
        commitMessage:
          type: string
          minLength: 1
        files:
          type: array
          items:
            $ref: "#/components/schemas/ProjectFile"
      required: [repository, commitMessage, files]
    PushResult:
      type: object
      properties:
        repositoryUrl:
          type: string
        commitUrl:
          type: ["string", "null"]
        message:
          type: string
      required: [repositoryUrl, commitUrl, message]
    AppPushInput:
      type: object
      properties:
        repository:
          type: string
          minLength: 1
        description:
          type: string
        private:
          type: boolean
        commitMessage:
          type: string
          minLength: 1
      required: [repository, commitMessage]
    AppPushResult:
      type: object
      properties:
        repositoryUrl:
          type: string
        commitUrl:
          type: ["string", "null"]
        message:
          type: string
        filesPublished:
          type: number
      required: [repositoryUrl, commitUrl, message, filesPublished]

